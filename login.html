{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <div class="card shadow-lg border-0" style="width: 370px; border-radius: 18px; background: rgba(255,255,255,0.97);">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="fas fa-user-circle fa-3x text-primary mb-2"></i>
        <h3 class="fw-bold mb-0" style="letter-spacing:1px;">Sign In</h3>
        <div class="text-muted small">Tokopedia Sentiment Admin</div>
      </div>
      <form method="post" autocomplete="off">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control form-control-lg rounded-pill" id="username" name="username" required autofocus style="background: #f5f6fa;">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control form-control-lg rounded-pill" id="password" name="password" required style="background: #f5f6fa;">
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold" style="font-size:1.1em; letter-spacing:0.5px;">Login</button>
      </form>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger mt-3 rounded-pill text-center py-2 px-3" style="font-size:0.98em;">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
    </div>
  </div>
</div>
{% endblock %}
